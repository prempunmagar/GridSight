<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>GridSight — Transmission Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        colors: {
          sev: {
            critical: '#DC2626',
            high: '#EA580C',
            moderate: '#D97706',
            low: '#475569',
            intact: '#16A34A',
          },
          surface: {
            canvas: '#FAFAFA',
            panel: '#FFFFFF',
            subtle: '#F1F5F9',
          },
          border: {
            DEFAULT: '#E2E8F0',
          },
          ink: {
            primary: '#0F172A',
            secondary: '#475569',
            tertiary: '#94A3B8',
          },
          brand: {
            DEFAULT: '#0369A1',
          },
        },
        boxShadow: {
          card: '0 1px 0 0 rgba(15,23,42,0.04)',
          cardHover: '0 6px 16px -6px rgba(15,23,42,0.12), 0 2px 4px -2px rgba(15,23,42,0.06)',
          pin: '0 2px 4px rgba(15,23,42,0.18)',
          panel: '-8px 0 24px -12px rgba(15,23,42,0.08)',
        },
        transitionTimingFunction: {
          panel: 'cubic-bezier(0.2, 0, 0, 1)',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #FAFAFA; color: #0F172A; font-family: 'Inter', system-ui, sans-serif; line-height: 1.4; }
  * { -webkit-font-smoothing: antialiased; }

  /* Selected pin pulsing ring: 1600ms loop, linear opacity, ease-out scale */
  @keyframes pinPulseScale { 0% { transform: scale(1); } 100% { transform: scale(2.6); } }
  @keyframes pinPulseOpacity { 0% { opacity: 0.55; } 100% { opacity: 0; } }
  .pin-pulse-ring {
    animation:
      pinPulseScale 1600ms cubic-bezier(0, 0, 0.2, 1) infinite,
      pinPulseOpacity 1600ms linear infinite;
    transform-origin: center;
  }

  /* Detail panel slide */
  @keyframes slidePanel { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .panel-enter { animation: slidePanel 240ms cubic-bezier(0.2, 0, 0, 1); }

  /* Card hover lift */
  .card-hover { transition: transform 120ms ease-out, box-shadow 120ms ease-out, border-color 120ms ease-out; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 6px 16px -6px rgba(15,23,42,0.12), 0 2px 4px -2px rgba(15,23,42,0.06); }

  /* Scrollbar restraint */
  .thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 4px; }
  .thin-scroll::-webkit-scrollbar-track { background: transparent; }

  /* Tooltip (only used on confidence dots + timeline strip) */
  .tt { position: relative; }
  .tt:hover .tt-pop { opacity: 1; transform: translate(-50%, -4px); }
  .tt-pop {
    position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 0);
    background: #0F172A; color: #fff; font-size: 11px; line-height: 1.3;
    padding: 4px 6px; border-radius: 4px; white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0; pointer-events: none; transition: opacity 120ms ease-out, transform 120ms ease-out;
    z-index: 50;
  }

  /* Range input restyle for video controls */
  video::-webkit-media-controls-panel { background-color: rgba(15,23,42,0.85); }

  /* Faint road grid pattern for the map */
  .map-bg {
    background-color: #EEF2F6;
    background-image:
      linear-gradient(to right, rgba(148,163,184,0.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,163,184,0.18) 1px, transparent 1px),
      linear-gradient(to right, rgba(148,163,184,0.10) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,163,184,0.10) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  /* Disable text-selection on the map background */
  .no-select { user-select: none; }
</style>
</head>
<body>
<div id="root" data-screen-label="GridSight Dashboard"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="gridsight.jsx"></script>
</body>
</html>
