document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

14px 12px 14px;\n    background: #fafbfc;\n  }\n  .pillar-title {\n    font-size: 10.5pt;\n    font-weight: 700;\n    color: #0a2540;\n    margin-bottom: 6px;\n  }\n  .pillar-body {\n    font-size: 9.5pt;\n    line-height: 1.5;\n    color: #374151;\n  }\n\n  .callout {\n    border-left: 3px solid #d97706;\n    background: #fffbeb;\n    padding: 10px 14px;\n    margin: 0.7em 0;\n    border-radius: 0 4px 4px 0;\n    font-size: 10pt;\n    page-break-inside: avoid;\n  }\n  .callout-label {\n    font-size: 8.5pt;\n    font-weight: 700;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: #d97706;\n    margin-bottom: 4px;\n  }\n\n  .severity-row {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 8px;\n    margin: 0.7em 0;\n    page-break-inside: avoid;\n  }\n  .sev {\n    border-radius: 4px;\n    padding: 8px 10px;\n    font-size: 9pt;\n    line-height: 1.35;\n    color: #ffffff;\n  }\n  .sev-label {\n    font-weight: 700;\n    font-size: 9pt;\n    letter-spacing: 0.05em;\n    text-transform: uppercase;\n    margin-bottom: 3px;\n  }\n  .sev.crit { background: #b91c1c; }\n  .sev.high { background: #ea580c; }\n  .sev.mod  { background: #ca8a04; }\n  .sev.low  { background: #4b5563; }\n\n  /* ----- Architecture diagram wrapper ----- */\n  .diagram {\n    margin: 0.8em 0 1.1em 0;\n    text-align: center;\n    page-break-inside: avoid;\n  }\n  .diagram svg { max-width: 100%; height: auto; }\n\n  /* ----- Footer band on body pages ----- */\n  .doc-footer {\n    margin-top: 0.5in;\n    padding-top: 0.15in;\n    border-top: 1px solid #e5e7eb;\n    font-size: 8.5pt;\n    color: #6b7280;\n    text-align: center;\n    font-style: italic;\n  }\n\n  /* ----- Page breaks ----- */\n  .page-break { page-break-before: always; }\n\n  /* ----- Avoid orphans ----- */\n  h1, h2, h3 { orphans: 3; widows: 3; }\n  p, li, td  { orphans: 2; widows: 2; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ============== COVER PAGE ============== -->\n<section class=\"cover\">\n  <div class=\"cover-body\">\n    <div class=\"cover-eyebrow\">Technical Documentation<\u002Fdiv>\n    <h1 class=\"cover-title\">GridSight<\u002Fh1>\n    <div class=\"cover-rule\"><\u002Fdiv>\n    <div class=\"cover-subtitle\">\n      Automated visual inspection for high-voltage transmission infrastructure.\n      Two-pass video understanding with Marengo&nbsp;3.0 and Pegasus&nbsp;1.2 on AWS Bedrock.\n    <\u002Fdiv>\n    <div class=\"cover-meta\">\n      <div>\n        <div class=\"cover-meta-label\">Hackathon<\u002Fdiv>\n        <div class=\"cover-meta-value\">Geospatial Video Intelligence Hackathon<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cover-meta-label\">Track<\u002Fdiv>\n        <div class=\"cover-meta-value\">02 — Energy Infrastructure Monitoring<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cover-meta-label\">Workflow<\u002Fdiv>\n        <div class=\"cover-meta-value\">02 — Transmission Line Inspection<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cover-meta-label\">Dates<\u002Fdiv>\n        <div class=\"cover-meta-value\">St. Louis · April 25–26, 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cover-meta-label\">Platform<\u002Fdiv>\n        <div class=\"cover-meta-value\">TwelveLabs via AWS Bedrock<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"cover-meta-label\">Models<\u002Fdiv>\n        <div class=\"cover-meta-value\">Marengo 3.0 · Pegasus 1.2<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cover-footer\">\n    <div>github.com/prempunmagar/GridSight<\u002Fdiv>\n    <div>Submission · Track 02 / Workflow 02<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== BODY ============== -->\n<div class=\"doc body-pages\">\n\n<!-- ============== AT A GLANCE ============== -->\n<section class=\"section\">\n  <h1><span style=\"padding: 0px 0px 0px 28px\">At a glance<\u002Fspan><\u002Fh1>\n  <p>\n    GridSight is an automated visual inspection pipeline for high-voltage transmission infrastructure.\n    It ingests the two standard outputs of any drone inspection — a video file and per-second telemetry —\n    and produces georeferenced, severity-scored findings ready for utility work-order systems.\n  <\u002Fp>\n\n  <div class=\"pillars\">\n    <div class=\"pillar\">\n      <div class=\"pillar-title\">Two-pass video understanding<\u002Fdiv>\n      <div class=\"pillar-body\">\n        Marengo retrieves candidate moments via semantic search across the full video; Pegasus produces a structured per-clip description.\n        A glint of sunlight that looks like insulator damage in one frame is correctly ignored once Marengo sees the same insulator clearly two seconds later.\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pillar\">\n      <div class=\"pillar-title\">Severity grounded in regulation<\u002Fdiv>\n      <div class=\"pillar-body\">\n        Vegetation findings are scored against NERC FAC-003-4 Minimum Vegetation Clearance Distance.\n        Insulator damage is scored against industry-standard failure modes. Each tier maps to a real action threshold, not a heuristic anomaly score.\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pillar\">\n      <div class=\"pillar-title\">Asset-centric output<\u002Fdiv>\n      <div class=\"pillar-body\">\n        The pipeline emits a record for every observed asset, including healthy ones. The dashboard filters by condition rather than the pipeline filtering before output —\n        honest about model false-positive surface and forward-compatible with predictive maintenance.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p>\n    <strong>Anomaly classes in scope:<\u002Fstrong> insulator damage and vegetation encroachment.\n    <strong>Asset target:<\u002Fstrong> lattice steel suspension towers carrying high-voltage AC transmission lines.\n    <strong>Canonical demo run:<\u002Fstrong> 345&nbsp;kV (MVCD 4.3&nbsp;ft).\n    <strong>Outputs:<\u002Fstrong> CSV, GeoJSON, structured JSON, plus a Next.js dashboard with map view, severity-coded finding pins, and 15-second evidence clip playback.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 1 — ARCHITECTURE ============== -->\n<section class=\"section page-break\">\n  <h1><span class=\"h1-num\">1<\u002Fspan><span>System Architecture<\u002Fspan><\u002Fh1>\n  <p>\n    The pipeline is a seven-stage linear flow with two parallel inputs. Each stage has a defined input/output contract so stages can be developed and tested independently.\n  <\u002Fp>\n\n  <div class=\"diagram\">\n    <svg viewBox=\"0 0 720 920\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Seven-stage GridSight pipeline\">\n      <defs>\n        <marker id=\"arrowhead\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n          <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#374151\"><\u002Fpath>\n        <\u002Fmarker>\n      <\u002Fdefs>\n\n      <!-- Inputs -->\n      <rect x=\"40\" y=\"14\" width=\"290\" height=\"62\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#94a3b8\" stroke-width=\"1\"><\u002Frect>\n      <text x=\"185\" y=\"38\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#0a2540\">demo_video.mp4<\u002Ftext>\n      <text x=\"185\" y=\"58\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"11\" fill=\"#475569\">curated 1080p · 13:32<\u002Ftext>\n\n      <rect x=\"390\" y=\"14\" width=\"290\" height=\"62\" rx=\"8\" fill=\"#f1f5f9\" stroke=\"#94a3b8\" stroke-width=\"1\"><\u002Frect>\n      <text x=\"535\" y=\"38\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#0a2540\">demo_video_telemetry.csv<\u002Ftext>\n      <text x=\"535\" y=\"58\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"11\" fill=\"#475569\">per-second GPS · DJI-SRT-compat<\u002Ftext>\n\n      <!-- Merge connector -->\n      <line x1=\"185\" y1=\"76\" x2=\"185\" y2=\"100\" stroke=\"#374151\" stroke-width=\"1.6\"><\u002Fline>\n      <line x1=\"535\" y1=\"76\" x2=\"535\" y2=\"100\" stroke=\"#374151\" stroke-width=\"1.6\"><\u002Fline>\n      <line x1=\"185\" y1=\"100\" x2=\"535\" y2=\"100\" stroke=\"#374151\" stroke-width=\"1.6\"><\u002Fline>\n      <line x1=\"360\" y1=\"100\" x2=\"360\" y2=\"124\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 1 -->\n      <rect x=\"180\" y=\"128\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"152\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 1<\u002Ftext>\n      <text x=\"262\" y=\"152\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Ingest inputs<\u002Ftext>\n      <text x=\"200\" y=\"170\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/ingest.py<\u002Ftext>\n      <line x1=\"360\" y1=\"184\" x2=\"360\" y2=\"206\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 2 -->\n      <rect x=\"180\" y=\"210\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"234\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 2<\u002Ftext>\n      <text x=\"262\" y=\"234\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Index video<\u002Ftext>\n      <text x=\"200\" y=\"252\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/marengo_index.py<\u002Ftext>\n      <text x=\"555\" y=\"234\" font-family=\"Helvetica\" font-size=\"10.5\" font-weight=\"600\" fill=\"#d97706\">Bedrock async<\u002Ftext>\n      <text x=\"555\" y=\"248\" font-family=\"Menlo, monospace\" font-size=\"9.5\" fill=\"#475569\">marengo-embed-3-0-v1:0<\u002Ftext>\n      <line x1=\"360\" y1=\"266\" x2=\"360\" y2=\"288\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 3 -->\n      <rect x=\"180\" y=\"292\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"316\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 3<\u002Ftext>\n      <text x=\"262\" y=\"316\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Detect anomalies<\u002Ftext>\n      <text x=\"200\" y=\"334\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/marengo_detect.py<\u002Ftext>\n      <text x=\"555\" y=\"316\" font-family=\"Helvetica\" font-size=\"10.5\" font-weight=\"600\" fill=\"#d97706\">similarity search<\u002Ftext>\n      <text x=\"555\" y=\"330\" font-family=\"Helvetica\" font-size=\"9.5\" fill=\"#475569\">NL queries → timestamps<\u002Ftext>\n      <line x1=\"360\" y1=\"348\" x2=\"360\" y2=\"370\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 4 -->\n      <rect x=\"180\" y=\"374\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"398\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 4<\u002Ftext>\n      <text x=\"262\" y=\"398\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Extract clips<\u002Ftext>\n      <text x=\"200\" y=\"416\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/clip_extract.py<\u002Ftext>\n      <text x=\"555\" y=\"398\" font-family=\"Helvetica\" font-size=\"10.5\" font-weight=\"600\" fill=\"#d97706\">ffmpeg subprocess<\u002Ftext>\n      <text x=\"555\" y=\"412\" font-family=\"Helvetica\" font-size=\"9.5\" fill=\"#475569\">10–15 s windows<\u002Ftext>\n      <line x1=\"360\" y1=\"430\" x2=\"360\" y2=\"452\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 5 -->\n      <rect x=\"180\" y=\"456\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"480\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 5<\u002Ftext>\n      <text x=\"262\" y=\"480\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Describe clips<\u002Ftext>\n      <text x=\"200\" y=\"498\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/pegasus_describe.py<\u002Ftext>\n      <text x=\"555\" y=\"480\" font-family=\"Helvetica\" font-size=\"10.5\" font-weight=\"600\" fill=\"#d97706\">Bedrock sync<\u002Ftext>\n      <text x=\"555\" y=\"494\" font-family=\"Menlo, monospace\" font-size=\"9.5\" fill=\"#475569\">pegasus-1-2-v1:0<\u002Ftext>\n      <line x1=\"360\" y1=\"512\" x2=\"360\" y2=\"534\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 6 -->\n      <rect x=\"180\" y=\"538\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"562\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 6<\u002Ftext>\n      <text x=\"262\" y=\"562\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Score + locate<\u002Ftext>\n      <text x=\"200\" y=\"580\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/severity.py<\u002Ftext>\n      <text x=\"555\" y=\"562\" font-family=\"Helvetica\" font-size=\"10.5\" font-weight=\"600\" fill=\"#d97706\">rules + telemetry<\u002Ftext>\n      <text x=\"555\" y=\"576\" font-family=\"Helvetica\" font-size=\"9.5\" fill=\"#475569\">NERC FAC-003 thresholds<\u002Ftext>\n      <line x1=\"360\" y1=\"594\" x2=\"360\" y2=\"616\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Stage 7 -->\n      <rect x=\"180\" y=\"620\" width=\"360\" height=\"56\" rx=\"6\" fill=\"#0a2540\"><\u002Frect>\n      <text x=\"200\" y=\"644\" font-family=\"Helvetica\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\">Stage 7<\u002Ftext>\n      <text x=\"262\" y=\"644\" font-family=\"Helvetica\" font-size=\"13\" fill=\"#ffffff\">Export<\u002Ftext>\n      <text x=\"200\" y=\"662\" font-family=\"Menlo, monospace\" font-size=\"10\" fill=\"#94a3b8\">pipeline/export.py<\u002Ftext>\n      <text x=\"555\" y=\"644\" font-family=\"Helvetica\" font-size=\"10.5\" font-weight=\"600\" fill=\"#d97706\">JSON · CSV · GeoJSON<\u002Ftext>\n      <text x=\"555\" y=\"658\" font-family=\"Helvetica\" font-size=\"9.5\" fill=\"#475569\">+ clips/<\u002Ftext>\n      <line x1=\"360\" y1=\"676\" x2=\"360\" y2=\"700\" stroke=\"#374151\" stroke-width=\"1.6\" marker-end=\"url(#arrowhead)\"><\u002Fline>\n\n      <!-- Dashboard -->\n      <rect x=\"120\" y=\"704\" width=\"480\" height=\"74\" rx=\"8\" fill=\"#fffbeb\" stroke=\"#d97706\" stroke-width=\"1.5\"><\u002Frect>\n      <text x=\"360\" y=\"734\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"14\" font-weight=\"700\" fill=\"#0a2540\">Next.js dashboard (app/)<\u002Ftext>\n      <text x=\"360\" y=\"752\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"11\" fill=\"#475569\">reads static files from disk · no API layer · no live AWS calls<\u002Ftext>\n      <text x=\"360\" y=\"768\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"10.5\" fill=\"#475569\">map view · severity pins · 15-second evidence clip playback<\u002Ftext>\n\n      <!-- Side label spanning Bedrock stages -->\n      <line x1=\"64\" y1=\"210\" x2=\"64\" y2=\"512\" stroke=\"#d97706\" stroke-width=\"1.5\"><\u002Fline>\n      <text x=\"56\" y=\"362\" text-anchor=\"middle\" font-family=\"Helvetica\" font-size=\"10\" font-weight=\"700\" fill=\"#d97706\" transform=\"rotate(-90 56 362)\">TwelveLabs · AWS Bedrock<\u002Ftext>\n\n      <!-- Side label spanning local stages -->\n      <line x1=\"64\" y1=\"128\" x2=\"64\" y2=\"184\" stroke=\"#94a3b8\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"64\" y1=\"538\" x2=\"64\" y2=\"676\" stroke=\"#94a3b8\" stroke-width=\"1\"><\u002Fline>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <h2><span class=\"h2-num\">1.1<\u002Fspan> Pipeline / dashboard contract<\u002Fh2>\n  <p>\n    The pipeline is a Python program that runs once and writes its output to disk under <code>app/public/data/<\u002Fcode> and <code>app/public/clips/<\u002Fcode>.\n    The dashboard is a Next.js app that reads those static files at startup. <strong>There is no runtime API between them.<\u002Fstrong>\n    The repository ships with the canonical run's output committed, so a judge can clone and run <code>npm run dev<\u002Fcode> to see the working dashboard immediately — no AWS credentials required.\n  <\u002Fp>\n  <p>\n    This decoupling is deliberate: it eliminates live AWS calls during the demo (no spinners, no failure modes on stage),\n    enables judges to inspect the dashboard without a Bedrock account, and keeps frontend iteration fast during the build.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 2 — DETECTION APPROACH ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">2<\u002Fspan><span>Anomaly Detection Approach<\u002Fspan><\u002Fh1>\n  <p>\n    GridSight detects anomalies through a two-pass system: Marengo retrieves candidate moments via semantic search across the full video;\n    Pegasus describes each clip with structured JSON output. Severity is then scored by a rules engine grounded in regulatory thresholds.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">2.1<\u002Fspan> Video understanding advantage over single-frame CV<\u002Fh2>\n  <p>\n    Marengo searches the entire video as a unit, not frame by frame. The model's per-clip multimodal embedding captures motion, scene context,\n    and entity relationships that single-frame classification cannot. Operationally this matters because most false positives in single-frame approaches are transient\n    visual artifacts — sun glints, motion blur, frame-edge crops of healthy components — that disappear once the same scene is observed across multiple seconds.\n    Marengo's similarity search at multi-second granularity does not generate those false positives.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">2.2<\u002Fspan> Query strategy<\u002Fh2>\n  <p>\n    Queries are defined as a configurable list in <code>pipeline/queries.py<\u002Fcode>, organized into two groups.\n  <\u002Fp>\n\n  <p><strong>Anomaly queries<\u002Fstrong> (always active in the narrow build):<\u002Fp>\n  <ul>\n    <li><em>Insulator damage:<\u002Fem> \"damaged or broken insulator disk on transmission tower\"; \"missing or shattered porcelain insulator\"; \"insulator string with visible contamination or burn marks\"; \"rust streaks on insulator hardware\".<\u002Fli>\n    <li><em>Vegetation encroachment:<\u002Fem> \"tree branches close to or touching power line conductors\"; \"vegetation overgrown into transmission line right-of-way\"; \"trees taller than power line clearance\".<\u002Fli>\n  <\u002Ful>\n\n  <p><strong>Inventory queries<\u002Fstrong> (broad, optional):<\u002Fp>\n  <ul>\n    <li>\"transmission tower with insulator strings visible\"; \"power line conductor crossing the right-of-way\"; \"vegetation along the transmission line corridor\".<\u002Fli>\n  <\u002Ful>\n\n  <p>\n    Each Marengo result is tagged with <code>discovery_source: \"anomaly_query\" | \"inventory_query\"<\u002Fcode>\n    so downstream stages can distinguish targeted detection from full-inventory observation.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">2.3<\u002Fspan> Pegasus prompt design<\u002Fh2>\n  <p>\n    Pegasus receives each extracted clip with a JSON-output prompt asking for: component type, condition (<code>intact<\u002Fcode> | <code>damaged<\u002Fcode> | <code>contaminated<\u002Fcode> | <code>unclear<\u002Fcode>),\n    specific defects (list), vegetation distance estimate in feet (when applicable), and qualitative confidence.\n  <\u002Fp>\n  <div class=\"callout\">\n    <div class=\"callout-label\">Architectural choice<\u002Fdiv>\n    Pegasus is a <strong>describer, not a filter<\u002Fstrong>. Every clip produces a record that flows downstream, including those Pegasus assesses as <code>intact<\u002Fcode>.\n    Filtering by condition happens in the dashboard, not in the pipeline. This keeps the architecture compatible with full-inventory monitoring as a future extension.\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== SECTION 3 — ASSET MODELING ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">3<\u002Fspan><span>Asset Modeling — What “Normal” Means<\u002Fspan><\u002Fh1>\n  <p>\n    The system assesses each finding against a class-specific model of normal.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">3.1<\u002Fspan> Class A — Insulator damage<\u002Fh2>\n  <p>\n    <strong>Normal:<\u002Fstrong> intact porcelain or polymer insulator strings with no visible damage, contamination, or hardware corrosion.\n    Anomalies are graded by failure mode: shattered or missing porcelain disks (<em>critical<\u002Fem>), severe cap-and-pin corrosion or polymer sheath splitting (<em>critical/high<\u002Fem>),\n    heavy contamination or flashover burn marks (<em>high<\u002Fem>), and lighter degradation patterns (<em>moderate/low<\u002Fem>).\n    Failure-mode taxonomy and severity rules: see <code>docs/05_DOMAIN_KNOWLEDGE.md<\u002Fcode> Sections 3.1 and 3.3.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">3.2<\u002Fspan> Class B — Vegetation encroachment<\u002Fh2>\n  <p>\n    <strong>Normal:<\u002Fstrong> vegetation outside the right-of-way, or inside the right-of-way but well below conductor height.\n    Anomalies are graded by distance to conductor as a multiple of the NERC FAC-003-4 Minimum Vegetation Clearance Distance (MVCD):\n  <\u002Fp>\n  <div class=\"severity-row\">\n    <div class=\"sev crit\">\n      <div class=\"sev-label\">Critical<\u002Fdiv>\n      Contact or within 1.0× MVCD — NERC violation in real time\n    <\u002Fdiv>\n    <div class=\"sev high\">\n      <div class=\"sev-label\">High<\u002Fdiv>\n      1.0× – 2.5× MVCD — active management threshold\n    <\u002Fdiv>\n    <div class=\"sev mod\">\n      <div class=\"sev-label\">Moderate<\u002Fdiv>\n      2.5× – 6.25× MVCD — within ROW, safe distance\n    <\u002Fdiv>\n    <div class=\"sev low\">\n      <div class=\"sev-label\">No-action<\u002Fdiv>\n      &gt; 6.25× MVCD outside the ROW\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p>\n    MVCD values are voltage-class dependent: 4.0&nbsp;ft for 230&nbsp;kV, <strong>4.3&nbsp;ft for 345&nbsp;kV<\u002Fstrong> (the demo default),\n    7.0&nbsp;ft for 500&nbsp;kV, 11.6&nbsp;ft for 765&nbsp;kV at sea level.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">3.3<\u002Fspan> Asset-centric data model<\u002Fh2>\n  <p>\n    The pipeline emits a record for every observed asset, including healthy ones (with <code>severity = no_action<\u002Fcode>).\n    The dashboard filters by condition rather than the pipeline filtering before output.\n    This is more honest about Marengo's false-positive surface (intact findings make it visible rather than hiding it)\n    and keeps the architecture forward-compatible with full-inventory monitoring.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 4 — TWELVELABS INTEGRATION ============== -->\n<section class=\"section page-break\">\n  <h1><span class=\"h1-num\">4<\u002Fspan><span>TwelveLabs Integration Strategy<\u002Fspan><\u002Fh1>\n  <p>\n    GridSight uses both TwelveLabs foundation models in distinct roles, accessed via AWS Bedrock Runtime in <code>us-east-1<\u002Fcode>.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">4.1<\u002Fspan> Marengo 3.0 — semantic video indexing and retrieval<\u002Fh2>\n  <ul>\n    <li><strong>Role:<\u002Fstrong> index the curated demo video as a single multimodal asset, then retrieve timestamped candidate moments via natural-language similarity search.<\u002Fli>\n    <li><strong>Invocation:<\u002Fstrong> asynchronous. <code>bedrock_runtime.start_async_invoke()<\u002Fcode> initiates the indexing job; the response includes an <code>invocationArn<\u002Fcode> that the pipeline polls via <code>get_async_invoke()<\u002Fcode> until status is <code>Completed<\u002Fcode>. Indexing output (vector embeddings) is written to S3.<\u002Fli>\n    <li><strong>Model ID:<\u002Fstrong> <code>twelvelabs.marengo-embed-3-0-v1:0<\u002Fcode>.<\u002Fli>\n  <\u002Ful>\n\n  <h2><span class=\"h2-num\">4.2<\u002Fspan> Pegasus 1.2 — structured per-clip description<\u002Fh2>\n  <ul>\n    <li><strong>Role:<\u002Fstrong> generate structured JSON descriptions of each Marengo-flagged candidate moment: component type, condition, defects, confidence.<\u002Fli>\n    <li><strong>Invocation:<\u002Fstrong> synchronous. <code>bedrock_runtime.invoke_model()<\u002Fcode> returns a generated text response in a single call. Each evidence clip is sent as a separate Pegasus invocation; calls are independent and parallelizable.<\u002Fli>\n    <li><strong>Model ID:<\u002Fstrong> <code>us.twelvelabs.pegasus-1-2-v1:0<\u002Fcode> (cross-region inference profile).<\u002Fli>\n    <li><strong>Prompt approach:<\u002Fstrong> structured-output prompt with an explicit JSON schema example. A fallback parser handles minor format drift (trailing commas, unwrapped strings).<\u002Fli>\n  <\u002Ful>\n\n  <h2><span class=\"h2-num\">4.3<\u002Fspan> Why both, not either alone<\u002Fh2>\n  <p>\n    Marengo finds the right <em>moments<\u002Fem>; Pegasus understands the <em>content<\u002Fem> at those moments.\n    Using only Marengo gives you timestamps with similarity scores but no condition assessment.\n    Using only Pegasus would require describing every second of the video — orders of magnitude more compute and no ranking signal for prioritization.\n    The two-pass architecture uses each model where it dominates: retrieval (Marengo) followed by structured generation (Pegasus).\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 5 — OPERATING ENVELOPE ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">5<\u002Fspan><span>Operating Envelope<\u002Fspan><\u002Fh1>\n  <p>\n    GridSight is scoped honestly. The system is designed for and validated on:\n  <\u002Fp>\n  <ul>\n    <li><strong>Video quality.<\u002Fstrong> 1080p consumer drone footage at 30 fps. Marengo's multimodal embedding handles bright-sun overexposure and harsh shadow conditions implicitly (no per-frame thresholds), but performance below 720p or with heavy compression artifacts is not characterized. Snow, fog, and night flights are out of scope for this build.<\u002Fli>\n    <li><strong>Asset type.<\u002Fstrong> Lattice steel suspension towers carrying high-voltage AC transmission lines. Monopole, wood-pole, and substation assets are out of scope.<\u002Fli>\n    <li><strong>Voltage class.<\u002Fstrong> Voltage-class agnostic by design — severity rules look up MVCD from a table indexed by voltage class. Switching from 345&nbsp;kV to 230 / 500 / 765&nbsp;kV requires a single configuration change. The canonical demo run is at 345&nbsp;kV.<\u002Fli>\n    <li><strong>Localization accuracy.<\u002Fstrong> Approximate (±50&nbsp;m typical at consumer-drone GPS accuracy), suitable for prioritizing inspection work orders. Sub-meter accuracy for regulatory documentation is not claimed.<\u002Fli>\n  <\u002Ful>\n  <p>\n    This scope was set deliberately at the start of the build. The brief calls out asset-diversity overreach as a common pitfall;\n    we addressed it by picking one tower class and one voltage class up front, and being explicit about what we don't handle.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 6 — CONFIDENCE HANDLING ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">6<\u002Fspan><span>Confidence Handling<\u002Fspan><\u002Fh1>\n  <p>\n    Operational readiness requires that each finding carry a transparent confidence signal a reviewer can trust.\n    GridSight emits two independent signals per finding:\n  <\u002Fp>\n  <ul>\n    <li><strong>Marengo similarity score<\u002Fstrong> — continuous, 0.0 to 1.0, from the indexing/retrieval step. Reflects how strongly the candidate moment matches the query embedding.<\u002Fli>\n    <li><strong>Pegasus qualitative confidence<\u002Fstrong> — <code>high<\u002Fcode> / <code>medium<\u002Fcode> / <code>low<\u002Fcode>, from the structured-description step. Reflects how confidently Pegasus made the condition assessment.<\u002Fli>\n  <\u002Ful>\n  <p>\n    A derived <code>combined_confidence<\u002Fcode> field (rule documented in <code>docs/01_MASTER.md<\u002Fcode> §10.3) is used for sorting and filtering in the dashboard.\n    Both raw signals remain visible in the per-finding detail panel — a reviewer who trusts Marengo more than Pegasus, or vice versa, can sort accordingly.\n  <\u002Fp>\n  <div class=\"callout\">\n    <div class=\"callout-label\">Severity × confidence are independent<\u002Fdiv>\n    A <code>critical<\u002Fcode> severity finding with <code>low<\u002Fcode> Pegasus confidence is <strong>flagged for human review<\u002Fstrong> rather than auto-routed to the work-order queue.\n    The system is explicit that high-stakes findings with weak confidence require expert eyes before action.\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== SECTION 7 — PERFORMANCE ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">7<\u002Fspan><span>Performance Benchmarks<\u002Fspan><\u002Fh1>\n  <p>\n    Measured on the canonical pipeline run (<code>run_20260426_113904<\u002Fcode>) against <code>data/curated/demo_video.mp4<\u002Fcode> (13:32, 1080p) with the seven anomaly queries active.\n  <\u002Fp>\n  <table>\n    <thead>\n      <tr>\n        <th>Metric<\u002Fth>\n        <th>Target<\u002Fth>\n        <th>Measured<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr>\n        <td>End-to-end processing time per minute of source video<\u002Ftd>\n        <td>&lt; 60 sec<\u002Ftd>\n        <td><strong>~28 sec<\u002Fstrong> / min source (cold cache)<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>Marengo indexing time (full 13:32 video)<\u002Ftd>\n        <td>&lt; 10 min<\u002Ftd>\n        <td><strong>30 sec<\u002Fstrong><\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>Pegasus invocation latency per clip (sync)<\u002Ftd>\n        <td>&lt; 15 sec<\u002Ftd>\n        <td><strong>~9 sec<\u002Fstrong> average<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>Total Bedrock cost per minute of footage<\u002Ftd>\n        <td>n/a<\u002Ftd>\n        <td><strong>~$0.30<\u002Fstrong> / min source (estimate)<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td>Findings produced per minute of footage<\u002Ftd>\n        <td>depends on damage density<\u002Ftd>\n        <td><strong>1.03<\u002Fstrong> findings / min<\u002Ftd>\n      <\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <p>\n    Cold-cache total runtime for a fresh re-analysis (Marengo index + 7 text embeddings + 14 Pegasus calls + exports) is approximately <strong>6 minutes<\u002Fstrong>.\n    Subsequent runs reuse on-disk caches for Marengo clip embeddings, text query embeddings, and Pegasus per-clip JSON,\n    so iteration on severity rules and exports completes in seconds.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 8 — INNOVATION ============== -->\n<section class=\"section page-break\">\n  <h1><span class=\"h1-num\">8<\u002Fspan><span>Innovation and Operational Extensions<\u002Fspan><\u002Fh1>\n  <p>\n    The asset-centric architecture intentionally enables several extensions that go beyond the brief's required scope.\n    None ship in this build, but each is reachable from the current data model with limited additional engineering.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">8.1<\u002Fspan> Agent-workflow ready (Workflow 03 substrate)<\u002Fh2>\n  <p>\n    Every observed asset emits a record carrying GPS, timestamp, and structured condition.\n    Cross-source correlation with SCADA telemetry or maintenance-history CSVs is a join on asset ID.\n    The data model deliberately preserves intact findings to make this join meaningful — assets that look healthy visually but show pressure anomalies in SCADA\n    are precisely the high-priority discovery target the brief calls out.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">8.2<\u002Fspan> Predictive maintenance<\u002Fh2>\n  <p>\n    The same substrate enables trend analysis across inspection dates. Hashing asset GPS to a stable identifier and comparing condition assessments across runs surfaces degradation progression —\n    an insulator string with rust streaks today and shattered porcelain six months later is the canonical predictive-maintenance signal.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">8.3<\u002Fspan> Regulatory compliance mapping<\u002Fh2>\n  <p>\n    Vegetation findings already map to NERC FAC-003-4 thresholds by construction.\n    The GeoJSON export schema includes the MVCD multiple as a property, which is the field a NERC compliance reporting workflow would consume directly.\n  <\u002Fp>\n\n  <h2><span class=\"h2-num\">8.4<\u002Fspan> Field-crew route optimization<\u002Fh2>\n  <p>\n    Findings on the dashboard map view are clustered by GPS proximity.\n    A geocoded route-planning step using any standard routing engine would convert finding clusters into ground-crew dispatch routes\n    ordered by severity-weighted urgency.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 9 — REPO ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">9<\u002Fspan><span>Repository and Reproduction<\u002Fspan><\u002Fh1>\n  <p>\n    GitHub: <a href=\"https://github.com/prempunmagar/GridSight\">github.com/prempunmagar/GridSight<\u002Fa>\n  <\u002Fp>\n\n  <p><strong>Setup<\u002Fstrong><\u002Fp>\n<pre><code>git clone https://github.com/prempunmagar/GridSight\ncd GridSight\npip install -r requirements.txt\ncd app &amp;&amp; npm install<\u002Fcode><\u002Fpre>\n\n  <p><strong>Verify Bedrock access (smoke test)<\u002Fstrong><\u002Fp>\n<pre><code>python examples/bedrock_smoke_test.py<\u002Fcode><\u002Fpre>\n\n  <p><strong>Run the full pipeline<\u002Fstrong><\u002Fp>\n<pre><code>python pipeline/run_all.py<\u002Fcode><\u002Fpre>\n\n  <p><strong>View the dashboard with the canonical pre-computed run<\u002Fstrong><\u002Fp>\n<pre><code>cd app &amp;&amp; npm run dev<\u002Fcode><\u002Fpre>\n\n  <p>\n    The dashboard runs without AWS credentials when reading the committed canonical run output.\n    Re-running the pipeline (which regenerates the output files) requires AWS Bedrock access with both Marengo&nbsp;3.0 and Pegasus&nbsp;1.2 enabled in <code>us-east-1<\u002Fcode>.\n  <\u002Fp>\n<\u002Fsection>\n\n<!-- ============== SECTION 10 — DOCUMENT MAP ============== -->\n<section class=\"section\">\n  <h1><span class=\"h1-num\">10<\u002Fspan><span>Document Map<\u002Fspan><\u002Fh1>\n  <table>\n    <thead>\n      <tr>\n        <th>Topic<\u002Fth>\n        <th>Document<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr><td>Full project source of truth (architecture, scope, decisions log)<\u002Ftd><td><code>docs/01_MASTER.md<\u002Fcode><\u002Ftd><\u002Ftr>\n      <tr><td>Six-phase build plan with decision gates<\u002Ftd><td><code>docs/02_BUILD_PLAN.md<\u002Fcode><\u002Ftd><\u002Ftr>\n      <tr><td>Repository layout and pipeline-dashboard contract<\u002Ftd><td><code>docs/03_REPO_STRUCTURE.md<\u002Fcode><\u002Ftd><\u002Ftr>\n      <tr><td>NERC FAC-003-4 numbers, insulator failure modes, severity rules<\u002Ftd><td><code>docs/05_DOMAIN_KNOWLEDGE.md<\u002Fcode><\u002Ftd><\u002Ftr>\n      <tr><td>Validation methodology, precision/recall/F1, false-positive analysis<\u002Ftd><td><code>docs/06_VALIDATION_REPORT.md<\u002Fcode><\u002Ftd><\u002Ftr>\n      <tr><td>Operational impact, ROI, deployment cost framing<\u002Ftd><td><code>docs/07_OPERATIONAL_IMPACT.md<\u002Fcode><\u002Ftd><\u002Ftr>\n      <tr><td>Dashboard UI/UX design specification<\u002Ftd><td><code>docs/09_UI_PROPOSAL.md<\u002Fcode><\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"doc-footer\">\n    GridSight · Geospatial Video Intelligence Hackathon, Track 02 · April 25–26, 2026\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
